[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policystack"
version = "0.1.0"
description = "A flexible reinforcement learning library built to support high-level and low-level policy training"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Harrison Deurwaarder"}]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0"
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["policystack"]